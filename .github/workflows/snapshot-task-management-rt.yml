name: Snapshot Task Management RT

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests and only build the deployable JAR"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build task-management runtime snapshot
    runs-on: windows-latest
    env:
      MAVEN_OPTS: -Dfile.encoding=UTF-8 -Xmx4096m -XX:MaxMetaspaceSize=1024m
      GH_PACKAGES_USER: naujoks-stefan
      GH_PACKAGES_TOKEN: ${{ secrets.KSF_PACKAGES_READ_TOKEN || secrets.PACKAGES_READ_TOKEN || secrets.PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configure Maven package credentials
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.m2" | Out-Null
          @"
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github-keel-spring-framework</id>
                <username>${env:GH_PACKAGES_USER}</username>
                <password>${env:GH_PACKAGES_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github-keel-spring-framework</id>
                    <url>https://maven.pkg.github.com/naujoks-stefan/keel-spring-framework</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>github-keel-spring-framework</id>
                    <url>https://maven.pkg.github.com/naujoks-stefan/keel-spring-framework</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>github-packages</activeProfile></activeProfiles>
          </settings>
          "@ | Set-Content -Path "$HOME\.m2\settings.xml" -Encoding UTF8

      - name: Run deployment tooling tests
        if: ${{ inputs.skip_tests != 'true' }}
        shell: pwsh
        run: mvn -B -ntp -pl brasi-nova-task-management-deployment-tools test

      - name: Run module tests
        if: ${{ inputs.skip_tests != 'true' }}
        shell: pwsh
        run: mvn -B -ntp -pl brasi-nova-task-management-rt -am test

      - name: Build deployable JAR
        shell: pwsh
        run: mvn -B -ntp -pl brasi-nova-task-management-rt -am package -DskipTests

      - name: Build incremental deployment dist
        shell: pwsh
        run: mvn -B -ntp -Pdeployment verify "-Dmaven.test.skip=true"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $source = Get-ChildItem -Path "brasi-nova-task-management-rt\target" -Filter "brasi-nova-task-management-rt-*.jar" |
            Where-Object { $_.Name -notlike "*-sources.jar" -and $_.Name -notlike "*-javadoc.jar" -and $_.Name -notlike "original-*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $source) { throw "No deployable brasi-nova-task-management-rt JAR found." }
          $dist = "dist\task-management-rt"
          if (Test-Path $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath $source.FullName -Destination "$dist\brasi-nova-task-management-rt.jar" -Force
          Get-FileHash -Algorithm SHA256 "$dist\brasi-nova-task-management-rt.jar" |
            ForEach-Object { "$($_.Hash)  brasi-nova-task-management-rt.jar" } |
            Set-Content -Path "$dist\brasi-nova-task-management-rt.jar.sha256" -Encoding ascii
          $deploymentDist = "brasi-nova-task-management-rt\target\deployment-dist"
          if (-not (Test-Path "$deploymentDist\deployment-manifest.json")) {
            throw "No incremental deployment manifest found."
          }
          Copy-Item -LiteralPath "$deploymentDist\deployment-manifest.json" -Destination "$dist\deployment-manifest.json" -Force
          $thin = Get-ChildItem -Path "$deploymentDist\application" -Filter "*.jar" | Select-Object -First 1
          if (-not $thin) { throw "No thin application artifact found." }
          Copy-Item -LiteralPath $thin.FullName -Destination "$dist\$($thin.Name)" -Force
          Copy-Item -Path "$deploymentDist\bundles\*.zip" -Destination $dist -Force
          Get-ChildItem -Path $dist -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash)  $($_.Name)"
            } |
            Set-Content -Path "$dist\deployment-assets.sha256" -Encoding ascii

      - name: Publish dependency content store
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\publish-deployment-content-store.ps1 `
            -DistDirectory "dist\task-management-rt" `
            -Repository "${{ github.repository }}" `
            -ContentStoreTag "deployment-content-store" `
            -Target "${{ github.sha }}"

      - name: Publish deployable snapshot release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "snapshot-task-management-rt-${{ github.run_id }}"
          $title = "Task Management RT Snapshot ${{ github.run_id }}"
          $notes = @"
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@
          $dist = "dist\task-management-rt"
          $thin = Get-ChildItem -Path $dist -Filter "brasi-nova-task-management-rt-*.jar" |
            Where-Object { $_.Name -ne "brasi-nova-task-management-rt.jar" } |
            Select-Object -First 1
          if (-not $thin) { throw "No thin application artifact prepared." }
          $assets = @(
            (Join-Path $dist "brasi-nova-task-management-rt.jar"),
            (Join-Path $dist "brasi-nova-task-management-rt.jar.sha256"),
            (Join-Path $dist "deployment-manifest.json"),
            $thin.FullName
          )
          gh release create $tag $assets --target "${{ github.sha }}" --title $title --notes $notes --prerelease

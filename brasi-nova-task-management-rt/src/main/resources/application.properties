spring.application.name=task-management

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:${KPL_CONFIG_URI:http://localhost:8888}}
spring.cloud.config.headers.X-API-Key=${KPL_CONFIG_API_KEY:${KPL_CONFIG_READ_API_KEY:}}

brasi.nova.jdbc.batch.delete=50
brasi.nova.jdbc.batch.insert=500
brasi.nova.jdbc.batch.update=500

nova.search.default-page-size=100

springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
# OpenAPI 3.0.1 statt des springdoc-Default 3.1: breitere Client-Generator-Kompatibilitaet und
# korrektes nullable-Rendering (swagger-core 2.2.x verwirft @Schema(nullable) in 3.1).
springdoc.api-docs.version=openapi_3_0

brasi.openapi.ui.path=/swagger-ui
brasi.openapi.ui.include-discovered-groups=true
brasi.openapi.ui.groups[0]=OVERVIEW

# Public Base fuer OpenAPI und HAL -- profil-spezifisch ueberschreiben via kpl-config
brasi.openapi.public-base=/task-management

# Deployment-Zeitzone fuer Audit-Zeitstempel; muss der OS-Zone von JVM UND SQL-Server entsprechen.
app.time.persistence-zone=Europe/Berlin

# --- Flyway: im Normalbetrieb deaktiviert (kein DB-Zugang beim Build). ---
# ITs schalten es gezielt ein (spring.flyway.enabled=true + weitere IT-Properties).
spring.flyway.enabled=false

# --- KSF Web-Security (FILTER-Modus mit JWT) ---
# Verbindlich gemaess arch-v2 §1.1; reale JWK-/Issuer-/Audience-Werte kommen aus kpl-config je Profil.
ksf.web-security.enabled=true
ksf.web-security.filter-chain.enabled=true
ksf.web-security.principal.profile-claim.enabled=true
ksf.web-security.tenant.context-binding=FILTER
ksf.web-security.tenant.binding.source=JWT
ksf.web-security.tenant.binding.required=false
ksf.web-security.tenant.entity-class=de.brasi.nova.taskmanagement.refentity.Firm
# /ws ist bewusst permitAll: der WS-Handshake ist ticket-gated (WsTicketHandshakeInterceptor,
# opakes Einmal-Ticket, kein JWT in der URL); die Ticket-Ausgabe /api/v1/ws-tickets bleibt
# JWT-/TASK_READ-geschuetzt (arch-v2 §6).
ksf.web-security.permit-paths=/actuator/health,/actuator/info,/v3/api-docs/**,/swagger-ui/**,/ws
#
# JWT-Konfiguration: NICHT hier ablegen - kommt per Laufzeit aus kpl-config (arch-v2 §1.1).
# Benoetigte kpl-config-Schluesse je Profil (Werte nur im Config-Server):
#   ksf.security.jwt.enabled=true
#   ksf.security.jwt.jwk.default-kid=<kid>
#   ksf.security.jwt.jwk.keys[0].kid=<kid>
#   ksf.security.jwt.jwk.keys[0].public-pem=<pem-resource-path>
#   ksf.security.jwt.required-issuer=<issuer>
#   ksf.security.jwt.required-audience=<audience>

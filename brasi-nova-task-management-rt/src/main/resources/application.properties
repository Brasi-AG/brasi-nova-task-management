spring.application.name=task-management

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:${KPL_CONFIG_URI:http://localhost:8888}}
spring.cloud.config.headers.X-API-Key=${KPL_CONFIG_API_KEY:${KPL_CONFIG_READ_API_KEY:}}

# Runtime profiles supply the Identity URL and API key, then opt in explicitly.
ksf.module-registration.enabled=false

brasi.nova.jdbc.batch.delete=50
brasi.nova.jdbc.batch.insert=500
brasi.nova.jdbc.batch.update=500

nova.search.default-page-size=100

springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
# OpenAPI 3.0.1 statt des springdoc-Default 3.1: breitere Client-Generator-Kompatibilitaet und
# korrektes nullable-Rendering (swagger-core 2.2.x verwirft @Schema(nullable) in 3.1).
springdoc.api-docs.version=openapi_3_0

brasi.openapi.ui.path=/swagger-ui
brasi.openapi.ui.include-discovered-groups=true
brasi.openapi.ui.groups[0]=OVERVIEW

# Public Base fuer OpenAPI und HAL -- profil-spezifisch ueberschreiben via kpl-config
brasi.openapi.public-base=/task-management

# Deployment-Zeitzone fuer Audit-Zeitstempel; muss der OS-Zone von JVM UND SQL-Server entsprechen.
app.time.persistence-zone=Europe/Berlin

# --- Flyway: im Normalbetrieb deaktiviert (kein DB-Zugang beim Build). ---
# ITs schalten es gezielt ein (spring.flyway.enabled=true + weitere IT-Properties).
spring.flyway.enabled=false

# --- KSF Web-Security (FILTER-Modus mit JWT) ---
# Verbindlich gemaess arch-v2 §1.1; reale JWK-/Issuer-/Audience-Werte kommen aus kpl-config je Profil.
ksf.web-security.enabled=true
ksf.web-security.filter-chain.enabled=true
ksf.web-security.principal.profile-claim.enabled=true
ksf.web-security.tenant.context-binding=FILTER
ksf.web-security.tenant.binding.source=JWT
ksf.web-security.tenant.binding.required=false
ksf.web-security.tenant.entity-class=de.brasi.nova.taskmanagement.refentity.Firm
# /ws ist bewusst permitAll: der WS-Handshake ist ticket-gated (WsTicketHandshakeInterceptor,
# opakes Einmal-Ticket, kein JWT in der URL); die Ticket-Ausgabe /api/v1/ws-tickets bleibt
# JWT-/TASK_READ-geschuetzt (arch-v2 §6).
ksf.web-security.permit-paths=/actuator/health,/actuator/info,/v3/api-docs/**,/swagger-ui/**,/ws
#
# JWT-Konfiguration: NICHT hier ablegen - kommt per Laufzeit aus kpl-config (arch-v2 §1.1).
# Benoetigte kpl-config-Schluesse je Profil (Werte nur im Config-Server):
#   ksf.security.jwt.enabled=true
#   ksf.security.jwt.jwk.default-kid=<kid>
#   ksf.security.jwt.jwk.keys[0].kid=<kid>
#   ksf.security.jwt.jwk.keys[0].public-pem=<pem-resource-path>
#   ksf.security.jwt.required-issuer=<issuer>
#   ksf.security.jwt.required-audience=<audience>

# --- Anhaenge (Intake #152) ---
# Nur im Config Server je Umgebung (nie hier):
#   task-management.attachments.storage.base-dir=<Basispfad>
#   task-management.attachments.enterprise-tenant-ids=<Mandanten-IDs, kommagetrennt>
task-management.attachments.max-per-target=20
task-management.attachments.limits.standard-max=5MB
task-management.attachments.limits.expert-min=5MB
task-management.attachments.limits.expert-max=10MB
task-management.attachments.limits.enterprise-min=10MB
task-management.attachments.limits.enterprise-max=15MB
task-management.attachments.limits.hard-max=15MB
task-management.attachments.thumbnail.width=600
task-management.attachments.thumbnail.jpeg-quality=0.85
task-management.attachments.thumbnail.max-source-pixels=50000000
# Vorschau-Erzeugung (PDF-Rendering, Bild-Dekodierung) auf eigenem, begrenztem Pool: hoechstens
# pool-size gleichzeitig, weitere warten in der Warteschlange; ist sie voll oder laeuft das
# Zeitlimit ab (einschliesslich Wartezeit), entsteht kein Vorschaubild und der Upload laeuft weiter.
task-management.attachments.thumbnail.pool-size=2
task-management.attachments.thumbnail.queue-capacity=8
task-management.attachments.thumbnail.timeout=PT10S
task-management.attachments.thumbnail.thread-name-prefix=attachment-thumbnail-
task-management.attachments.cache.content-max-age=P1D
task-management.attachments.cache.thumbnail-max-age=P10D
spring.servlet.multipart.max-file-size=${task-management.attachments.limits.hard-max}
spring.servlet.multipart.max-request-size=301MB
server.tomcat.max-part-count=30
server.tomcat.max-swallow-size=301MB
# Auslieferung (StreamingResponseBody): Spring MVC bricht eine asynchrone Anfrage nach der
# Servlet-Vorgabe von 30 Sekunden ab, das waere fuer grosse Dateien bei langsamen Clients zu kurz.
# Die Frist gilt fuer alle asynchronen Anfragen dieses Dienstes.
spring.mvc.async.request-timeout=5m
# Eigener, begrenzter Thread-Pool fuer die Auslieferung statt des geteilten applicationTaskExecutor:
# bis zu core-size gleichzeitige Auslieferungen, weitere warten in der Warteschlange; ist sie voll,
# wachsen Threads bis max-size, danach antwortet der Dienst mit 503 und dem Header Retry-After
# (Wartezeit: retry-after).
task-management.attachments.streaming.core-size=16
task-management.attachments.streaming.max-size=32
task-management.attachments.streaming.queue-capacity=50
task-management.attachments.streaming.thread-name-prefix=attachment-stream-
task-management.attachments.streaming.retry-after=PT5S

# --- Abteilungs-Abgleich (Intake #190) ---
# Nur im Config Server je Umgebung:
#   task-management.division-sync.application-base-url=<Basis-URL von application>
#   task-management.division-sync.oauth2.token-url=<Token-Endpunkt von KPL Identity>
#   task-management.division-sync.oauth2.client-id=<Client-ID von task-management>
#   task-management.division-sync.oauth2.client-secret=<Secret des Clients>
# Mit enabled=false (Vorgabe) startet task-management ohne Abgleich und ruft nichts nach aussen auf.
task-management.division-sync.enabled=false
task-management.division-sync.destination=jms.topic.brasi-nova.${ksf.event.profile:}.divisions.DivisionMembershipChanged
task-management.division-sync.subscription-name=task-management.division-membership
task-management.division-sync.oauth2.scope=masterdata.sync.read
task-management.division-sync.max-delivery-attempts=5
task-management.division-sync.http.connect-timeout=PT5S
task-management.division-sync.http.read-timeout=PT15S
task-management.division-sync.resync.cron=0 30 3 * * *
task-management.division-sync.receipt-retention=P30D
